<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Heart Phrase Effect</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0b1d3a, #02040a);
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* กล่องกลาง */
    .center-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .heart {
      position: relative;
      font-size: 96px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease, filter 0.2s ease;

      filter:
        drop-shadow(0 0 20px rgba(255, 80, 120, 0.8))
        drop-shadow(0 0 40px rgba(255, 80, 120, 0.6));
    }

    .heart.clicked {
      transform: scale(1.5);
      filter:
        drop-shadow(0 0 30px rgba(255, 100, 150, 1))
        drop-shadow(0 0 60px rgba(255, 100, 150, 0.9))
        drop-shadow(0 0 90px rgba(255, 100, 150, 0.7));
    }

    /* ข้อความใต้หัวใจ */
    .hint {
      margin-top: 32px;
      font-size: 18px;
      text-align: center;
      opacity: 0.85;
      animation: hintFloat 2.5s ease-in-out infinite;
    }

    @keyframes hintFloat {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    /* ข้อความลอยตอนคลิก */
    .phrase {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 18px;

      background: rgba(255, 100, 150, 0.25);
      backdrop-filter: blur(8px);
      border-radius: 20px;

      font-size: 16px;
      white-space: nowrap;
      animation: floatUp 3s ease forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -260px) scale(1.05);
      }
    }
  </style>
</head>

<body>

  <div class="center-wrap">
    <div id="heartBtn" class="heart">❤️</div>
    <div class="hint">
      จิ้มเยยยย 🥺<br>
      จิ้มสิ อิอิ 💖
    </div>
  </div>

  <script>
    const heartBtn = document.getElementById('heartBtn');

    const phrases = [
      'ตะเอ๋ อิอิ 😺',
      'happy new year Naka BiBi❤️',
      'รักบี๋มาก จุ๊บๆ 🌟',
      'ขอบคุณที่อยู่ด้วยกันจนถึงสิ้นปีงับบ💖',
      'มาเริ่มปีใหม่ด้วยกันน๊าาา',
      'อยากกลับไปจุ๊บแย้วว 🥺',
      'อย่าให้มิ้งค์ต้องล่า 😎',
      'ขอให้ปีหน้างานราบรื่นน๊าาา 💗',
      'ทำไมมาร์ทชอบพูดไม่ฟัง 😡',
      'มิ้งค์รักมาร์ทที่ฉุดดดด 😻😻',
      'เลิฟยู อิอิ 😘',
      'ถ้าเค้าหัวโล้นเธอจะรักเค้ามั้ย 😾',
      'คนฉวยทำให้สุดหล่อโดยเฉพาะ ชอบมุ้ยยย 😋',
      'ขอจับ...หน่อย 👁️👄👁️',
    ];

    function createPhrase() {
      const phrase = document.createElement('div');
      phrase.className = 'phrase';
      phrase.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      document.body.appendChild(phrase);

      phrase.addEventListener('animationend', () => phrase.remove());
    }

    function releasePhrase() {
      heartBtn.classList.add('clicked');
      setTimeout(() => heartBtn.classList.remove('clicked'), 200);
      createPhrase();
    }

    heartBtn.addEventListener('click', releasePhrase);
  </script>

</body>
</html>
